services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: huriza
      POSTGRES_USER: huriza
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - huriza_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huriza"]
      interval: 5s
      retries: 10
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?Set Firebase browser config}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:?Set Firebase browser config}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:?Set Firebase browser config}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:?Set Firebase browser config}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://huriza:${POSTGRES_PASSWORD}@database:5432/huriza
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?Set Firebase Admin project}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:?Set Firebase Admin credentials}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:?Set Firebase Admin credentials}
      COOKIE_SECURE: "false"
    depends_on:
      database:
        condition: service_healthy
volumes:
  huriza_pg:
